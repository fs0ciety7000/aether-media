<!doctype html>
<html lang="fr" data-theme="nuit" data-grain="off">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#04121D" />
		<meta name="color-scheme" content="dark light" />
		<title>Aether</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- Installed on iOS (Add to Home Screen): full-screen app, status bar over the night ground. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Aether" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="application-name" content="Aether" />
		<script>
			// Apply the stored theme before first paint (no flash). Mirrors src/lib/theme.svelte.ts.
			(function () {
				var bg = { nuit: '#04121D', 'salle-obscure': '#121010', velours: '#140F10', ardoise: '#101214', noyer: '#13110E', lin: '#F3EFE8' };
				var root = document.documentElement;
				var theme = 'nuit';
				var grain = 'off';
				try {
					var t = localStorage.getItem('aether:theme');
					if (t && (bg[t] || t === 'system')) theme = t;
					if (localStorage.getItem('aether:grain') === 'on') grain = 'on';
				} catch (e) {}
				root.setAttribute('data-theme', theme);
				root.setAttribute('data-grain', grain);
				var resolved = theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'lin' : 'nuit') : theme;
				document.querySelector('meta[name="theme-color"]').setAttribute('content', bg[resolved]);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
