version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
  settings:
    misspell:
      # French words that look like English misspellings.
      ignore-rules: [interm, marrage]
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - io.WriteString
        - fmt.Fprint
        - fmt.Fprintf
  exclusions:
    generated: strict
    rules:
      - linters: [errcheck]
        path: _test\.go
      - linters: [revive]
        text: "exported|package-comments"
formatters:
  enable:
    - gofmt
    - goimports
