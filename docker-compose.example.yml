# Exemple : docker compose -f docker-compose.example.yml up -d
services:
  aether:
    image: ghcr.io/fs0ciety7000/aether:latest
    build: .
    container_name: aether
    user: "1000:1000"
    ports:
      - "8096:8096"
    environment:
      TZ: Europe/Paris
    volumes:
      - ./data:/data
      # Vos bibliothèques, en lecture seule (chemins compatibles *arr).
      - /srv/media/movies:/media/movies:ro
      - /srv/media/tv:/media/tv:ro
      - /srv/media/music:/media/music:ro
    # Accélération matérielle (VAAPI / QSV), plus tard :
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
